<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Video Speed Controller — Opciones</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>Video Speed Controller</h1>

      <section>
        <h2>Atajos de teclado</h2>
        <label class="row checkbox-row">
          <input type="checkbox" id="shortcutsEnabled" />
          <span>Activar atajos de teclado</span>
        </label>
        <p class="hint">Click en un campo y presiona la tecla deseada. No funcionan si el foco está en un campo de texto de la página.</p>
        <div class="keybind-grid" id="keybindGrid"></div>
      </section>

      <section>
        <h2>General</h2>
        <label class="row">
          <span>Segundos de skip (Z / X)</span>
          <input type="number" id="skipSeconds" min="1" max="120" step="1" />
        </label>
        <label class="row">
          <span>Incremento de velocidad</span>
          <input type="number" id="speedStep" min="0.05" max="1" step="0.05" />
        </label>
        <label class="row">
          <span>Velocidad mínima</span>
          <input type="number" id="minSpeed" min="0.1" max="1" step="0.1" />
        </label>
        <label class="row">
          <span>Velocidad máxima</span>
          <input type="number" id="maxSpeed" min="1" max="16" step="0.1" />
        </label>
        <label class="row checkbox-row">
          <input type="checkbox" id="perSitePersistence" />
          <span>Recordar velocidad por sitio</span>
        </label>
      </section>

      <section>
        <h2>Sitios con velocidad guardada</h2>
        <table id="siteTable">
          <thead>
            <tr><th>Sitio</th><th>Velocidad</th><th></th></tr>
          </thead>
          <tbody id="siteTableBody"></tbody>
        </table>
        <p class="hint" id="siteEmptyMsg">Sin sitios guardados todavía.</p>
      </section>

      <button id="btnSave">Guardar cambios</button>
      <div id="saveMsg" class="save-msg"></div>
    </div>
    <script src="../lib/storage.js"></script>
    <script src="options.js"></script>
  </body>
</html>
